<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
body {
  margin: 0;
  background-color: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}

.game-container {
  position: relative;
  width: 100%;
  max-width: 20vw;
  aspect-ratio: 3/5;
  max-height: 60vh;
}

.score {
  position: absolute;
  top: -30px;
  left: 0;
  font-size: 24px;
}

canvas {
  border: 1px solid black;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
}

.controls button {
  border: none;
  background: none;
  padding: 0;
  margin: 5px;
  touch-action: manipulation;
  width: 60px;
  height: 60px;
}

.controls button img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.arrow-btns {
  display: flex;
  justify-content: center;
  width: 100%;
  gap: 2vw ;
}

@media (max-width: 768px) {
  .game-container {
    max-width: 98vw !important;
    max-height: 80.6vh !important;
    margin-top: 1vh !important;
  }
  .score {
    top: -40px;
    right: 10px;
    font-size: 18px;
    margin-top: 20px !important;
  }
  .controls button {
    width: 40px !important;
    height: 40px !important;
    margin: 2px !important;
  }
  .arrow-btns {
    gap: 15vw !important;
  }
}
</style>
</head>
<body>
<div class="game-container">
<div class="score">Score: <span id="score">0</span></div>
<canvas id="canvas"></canvas>
</div>
<div class="controls">
  <div class="arrow-btns">
    <button id="left-btn" style="transform: scaleX(-1);" ><img src="https://www.freeiconspng.com/thumbs/arrow-icon/right-arrow-icon-27.png" alt="Left"></button>
    <button id="down-btn"><img src="https://www.freeiconspng.com/thumbs/arrow-down-icon-png/arrow-down-icon-png-3.png" alt="Down"></button>
    <button id="rotate-btn"><img src="https://static.vecteezy.com/system/resources/thumbnails/022/951/427/small/rotation-arrow-icon-png.png" alt="Rotate"></button>
    <button id="right-btn"><img src="https://www.freeiconspng.com/thumbs/arrow-icon/right-arrow-icon-27.png" alt="Right"></button>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.querySelector('.game-container');
const scoreElement = document.getElementById('score');
canvas.width = container.clientWidth;
canvas.height = container.clientHeight;
const gridWidth = 13;
const gridHeight = Math.floor(canvas.height / (canvas.width / gridWidth));
const gridSize = Math.floor(canvas.width / gridWidth);
const offsetX = (canvas.width - gridSize * gridWidth) / 2;
let score = 0;
let pieces = [
[[1, 1], [1, 1]], // O
[[1, 0, 0], [1, 1, 1]], // T
[[0, 0, 1], [1, 1, 1]], // L
[[1, 1, 1], [0, 0, 1]], // J
[[1, 1, 0], [0, 1, 1]], // S
[[0, 1, 1], [1, 1, 0]], // Z
[[1], [1], [1], [1]] // I
];
let currentPiece = getRandomPiece();
let grid = Array(gridHeight).fill(0).map(() => Array(gridWidth).fill(0));
let gameOver = false;

function getRandomPiece() {
let piece = pieces[Math.floor(Math.random() * pieces.length)];
return {
x: Math.floor(gridWidth / 2) - Math.floor(piece[0].length / 2),
y: 0,
shape: piece
};
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let y = 0; y < gridHeight; y++) {
for (let x = 0; x < gridWidth; x++) {
if (grid[y][x]) {
ctx.fillStyle = 'black';
ctx.fillRect(x * gridSize + offsetX, y * gridSize, gridSize, gridSize);
}
}
}
for (let y = 0; y < currentPiece.shape.length; y++) {
for (let x = 0; x < currentPiece.shape[y].length; x++) {
if (currentPiece.shape[y][x]) {
ctx.fillStyle = '#b34d91';
ctx.fillRect((currentPiece.x + x) * gridSize + offsetX, (currentPiece.y + y) * gridSize, gridSize, gridSize);
}
}
}
if (gameOver) {
ctx.font = `${gridSize * 2}px Arial`;
ctx.fillStyle = 'black';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
}
}

let lastTime = 0;
let dropInterval = 500; // adjust this value to change the drop speed
let dropFast = false;

document.getElementById('down-btn').addEventListener('mousedown', () => {
if (gameOver) return;
dropFast = true;
});

document.getElementById('down-btn').addEventListener('mouseup', () => {
dropFast = false;
});

document.getElementById('down-btn').addEventListener('touchstart', () => {
if (gameOver) return;
dropFast = true;
});

document.getElementById('down-btn').addEventListener('touchend', () => {
dropFast = false;
});

function update(time) {
  if (gameOver) return;
  let deltaTime = time - lastTime;
  lastTime = time;
  
  let dropIntervalTemp = dropInterval;
  if (dropFast) {
    dropIntervalTemp = 15; // adjust this value to change the fast drop speed
  }
  
  if (!canMove(0, 1)) {
    placePiece();
    clearLines();
    if (checkGameOver()) {
      gameOver = true;
    } else {
      currentPiece = getRandomPiece();
      dropFast = false;
    }
  } else {
    currentPiece.y += deltaTime / dropIntervalTemp;
  }
  
  draw();
  scoreElement.textContent = score;
  requestAnimationFrame(update);
}

function canMove(dx, dy) {
for (let y = 0; y < currentPiece.shape.length; y++) {
for (let x = 0; x < currentPiece.shape[y].length; x++) {
if (currentPiece.shape[y][x]) {
let nx = currentPiece.x + x + dx;
let ny = Math.floor(currentPiece.y) + y + dy;
if (nx < 0 || nx >= gridWidth || ny >= gridHeight || (ny >= 0 && grid[ny][nx])) {
return false;
}
}
}
}
return true;
}

function placePiece() {
  for (let y = 0; y < currentPiece.shape.length; y++) {
    for (let x = 0; x < currentPiece.shape[y].length; x++) {
      if (currentPiece.shape[y][x]) {
        let nx = currentPiece.x + x;
        let ny = Math.floor(currentPiece.y) + y;
        if (ny >= 0) {
          grid[ny][nx] = 1;
        }
      }
    }
  }
}

function clearLines() {
for (let y = 0; y < gridHeight; y++) {
if (grid[y].every(cell => cell)) {
grid.splice(y, 1);
grid.unshift(Array(gridWidth).fill(0));
score++;
}
}
}

function checkGameOver() {
for (let x = 0; x < gridWidth; x++) {
if (grid[0][x] === 1) {
return true;
}
}
return false;
}

document.addEventListener('keydown', e => {
if (gameOver) return;
if (e.key === 'ArrowLeft' && canMove(-1, 0)) currentPiece.x--;
if (e.key === 'ArrowRight' && canMove(1, 0)) currentPiece.x++;
if (e.key === 'ArrowDown') {
dropFast = true;
}
if (e.key === 'ArrowUp') {
let rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
let oldShape = currentPiece.shape;
currentPiece.shape = rotated;
if (!canMove(0, 0)) currentPiece.shape = oldShape;
if (currentPiece.x + currentPiece.shape[0].length > gridWidth) {
currentPiece.x = gridWidth - currentPiece.shape[0].length;
}
if (currentPiece.x < 0) {
currentPiece.x = 0;
}
}
});

document.addEventListener('keyup', e => {
if (e.key === 'ArrowDown') {
dropFast = false;
}
});

document.getElementById('left-btn').addEventListener('click', () => {
if (gameOver) return;
if (canMove(-1, 0)) currentPiece.x--;
});

document.getElementById('right-btn').addEventListener('click', () => {
if (gameOver) return;
if (canMove(1, 0)) currentPiece.x++;
});

document.getElementById('rotate-btn').addEventListener('click', () => {
if (gameOver) return;
let rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
let oldShape = currentPiece.shape;
currentPiece.shape = rotated;
if (!canMove(0, 0)) currentPiece.shape = oldShape;
if (currentPiece.x + currentPiece.shape[0].length > gridWidth) {
currentPiece.x = gridWidth - currentPiece.shape[0].length;
}
if (currentPiece.x < 0) {
currentPiece.x = 0;
}
});

requestAnimationFrame(update);
draw(); 
</script>
</body>
</html>
