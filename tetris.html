<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
body {
margin: 0;
background-color: #f0f0f0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
canvas {
border: 1px solid black;
width: 100%;
height: auto;
pointer-events: none; /* add this line */
}
.game-container {
width: 100%;
max-width: 20vw;
aspect-ratio: 3/5;
max-height: 80vh;
}

.controls button {
touch-action: manipulation;
}


@media (max-width: 768px) {
.game-container {
max-width: 98vw !important;
max-height: 77vh !important;
margin-top: -20vh;
}
.controls {
position: relative; /* change to relative */
bottom: auto; /* reset bottom */
left: auto; /* reset left */
width: auto; /* reset width */
display: flex;
flex-direction: column; /* change to column */
align-items: center; /* center the buttons */
margin-top: 20px; /* add some space */
z-index: 100 !important;
}

.controls button {
width: 50px !important; /* adjust the width */
height: 50px !important; /* adjust the height */
font-size: 36px; /* adjust the font size */
margin-bottom: -2vh !important;
}
.rotate-btn-container {
display: flex;
justify-content: center;
width: 100%;
margin-bottom: 10px;
}
}



.controls {
position: absolute;
bottom: 20px;
left: 0;
width: 100%;
display: flex;
flex-direction: column; /* change to column */
align-items: center; /* center the buttons */
z-index: 1; /* add this line */
}
.controls button {
width: 60px;
height: 60px;
border-radius: 50%;
background-color: #888285;
color: white;
border: none;
font-size: 24px;
margin: 5px;
}
.rotate-btn-container {
display: flex;
justify-content: center;
width: 100%;
margin-bottom: 10px;
}
.arrow-btns {
display: flex;
justify-content: space-between;
width: 100%;
}
</style>
</head>
<body>
<div class="game-container">
<canvas id="canvas"></canvas>
<div class="controls">
<div class="rotate-btn-container">
<button id="rotate-btn">&#x21BB;</button>
</div>
<div class="arrow-btns">
<button id="left-btn">&#x25C4;</button>
<button id="down-btn">&#x25BC;</button>
<button id="right-btn">&#x25BA;</button>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.querySelector('.game-container');
canvas.width = container.clientWidth;
canvas.height = container.clientHeight;
const gridSize = Math.floor(canvas.width / 10);
const gridWidth = Math.floor(canvas.width / gridSize);
const gridHeight = Math.floor(canvas.height / gridSize);
let score = 0;
let pieces = [
[[1, 1], [1, 1]], // O
[[1, 0, 0], [1, 1, 1]], // T
[[0, 0, 1], [1, 1, 1]], // L
[[1, 1, 1], [0, 0, 1]], // J
[[1, 1, 0], [0, 1, 1]], // S
[[0, 1, 1], [1, 1, 0]], // Z
[[1], [1], [1], [1]] // I
];
let currentPiece = getRandomPiece();
let grid = Array(gridHeight).fill(0).map(() => Array(gridWidth).fill(0));
let gameOver = false;

function getRandomPiece() {
let piece = pieces[Math.floor(Math.random() * pieces.length)];
return {
x: Math.floor(gridWidth / 2) - Math.floor(piece[0].length / 2),
y: 0,
shape: piece
};
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let y = 0; y < gridHeight; y++) {
for (let x = 0; x < gridWidth; x++) {
if (grid[y][x]) {
ctx.fillStyle = 'black';
ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
}
}
}
for (let y = 0; y < currentPiece.shape.length; y++) {
for (let x = 0; x < currentPiece.shape[y].length; x++) {
if (currentPiece.shape[y][x]) {
ctx.fillStyle = '#b34d91';
ctx.fillRect((currentPiece.x + x) * gridSize, (currentPiece.y + y) * gridSize, gridSize, gridSize);
}
}
}
ctx.font = `${gridSize}px Arial`;
ctx.fillStyle = 'black';
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.fillText(`Score: ${score}`, 10, 10);
if (gameOver) {
ctx.font = `${gridSize * 2}px Arial`;
ctx.fillStyle = 'black';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
}
}

function update() {
if (gameOver) return;
if (canMove(0, 1)) {
currentPiece.y++;
} else {
placePiece();
clearLines();
if (checkGameOver()) {
gameOver = true;
} else {
currentPiece = getRandomPiece();
}
}
draw();
}

function canMove(dx, dy) {
for (let y = 0; y < currentPiece.shape.length; y++) {
for (let x = 0; x < currentPiece.shape[y].length; x++) {
if (currentPiece.shape[y][x]) {
let nx = currentPiece.x + x + dx;
let ny = currentPiece.y + y + dy;
if (nx < 0 || nx >= gridWidth || ny >= gridHeight || (ny >= 0 && grid[ny][nx])) {
return false;
}
}
}
}
return true;
}

function placePiece() {
for (let y = 0; y < currentPiece.shape.length; y++) {
for (let x = 0; x < currentPiece.shape[y].length; x++) {
if (currentPiece.shape[y][x]) {
let nx = currentPiece.x + x;
let ny = currentPiece.y + y;
if (ny >= 0) {
grid[ny][nx] = 1;
}
}
}
}
}

function clearLines() {
for (let y = 0; y < gridHeight; y++) {
if (grid[y].every(cell => cell)) {
grid.splice(y, 1);
grid.unshift(Array(gridWidth).fill(0));
score++;
}
}
}

function checkGameOver() {
for (let x = 0; x < gridWidth; x++) {
if (grid[0][x] === 1) {
return true;
}
}
return false;
}

document.addEventListener('keydown', e => {
if (gameOver) return;
if (e.key === 'ArrowLeft' && canMove(-1, 0)) currentPiece.x--;
if (e.key === 'ArrowRight' && canMove(1, 0)) currentPiece.x++;
if (e.key === 'ArrowDown') update();
if (e.key === 'ArrowUp') {
let rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
let oldShape = currentPiece.shape;
currentPiece.shape = rotated;
if (!canMove(0, 0)) currentPiece.shape = oldShape;
if (currentPiece.x + currentPiece.shape[0].length > gridWidth) {
currentPiece.x = gridWidth - currentPiece.shape[0].length;
}
if (currentPiece.x < 0) {
currentPiece.x = 0;
}
}
});

document.getElementById('left-btn').addEventListener('click', () => {
if (gameOver) return;
if (canMove(-1, 0)) currentPiece.x--;
});

document.getElementById('right-btn').addEventListener('click', () => {
if (gameOver) return;
if (canMove(1, 0)) currentPiece.x++;
});

document.getElementById('down-btn').addEventListener('click', () => {
if (gameOver) return;
update();
});

document.getElementById('rotate-btn').addEventListener('click', () => {
if (gameOver) return;
let rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
let oldShape = currentPiece.shape;
currentPiece.shape = rotated;
if (!canMove(0, 0)) currentPiece.shape = oldShape;
if (currentPiece.x + currentPiece.shape[0].length > gridWidth) {
currentPiece.x = gridWidth - currentPiece.shape[0].length;
}
if (currentPiece.x < 0) {
currentPiece.x = 0;
}
});

setInterval(update, 500);
draw();
</script>
</body>
</html>
