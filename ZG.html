<script>
  // Check if the device is a mobile device and in portrait mode
  if (window.matchMedia("(max-width: 767px)").matches && window.matchMedia("(orientation: portrait)").matches) {
    // Create a overlay element to display the message
    var overlay = document.createElement('div');
    overlay.style.position = 'fixed';
    overlay.style.top = '0';
    overlay.style.left = '0';
    overlay.style.width = '100vw';
    overlay.style.height = '100vh';
    overlay.style.backgroundImage = 'url("https://images.unsplash.com/photo-1722278239395-9a03e0f045ba?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxjb2xsZWN0aW9uLXBhZ2V8MXw4MjM4MDh8fGVufDB8fHx8fA%3D%3D")';
    overlay.style.backgroundSize = 'cover';
    overlay.style.backgroundPosition = 'center';
    overlay.style.display = 'flex';
    overlay.style.justifyContent = 'center';
    overlay.style.alignItems = 'center';
    overlay.style.zIndex = '9999';
    overlay.style.overflow = 'hidden';

    // Create a message container
    var message = document.createElement('div');
    message.style.background = 'rgba(0, 0, 0, 0.5)';
    message.style.padding = '20px';
    message.style.borderRadius = '10px';
    message.style.color = '#fff';
    message.style.fontSize = '24px';
    message.style.textAlign = 'center';
    message.innerHTML = 'Please rotate your device to landscape mode';

    // Add the message to the overlay
    overlay.appendChild(message);

    // Add the overlay to the body
    document.body.style.position = 'fixed';
    document.body.style.top = '0';
    document.body.style.left = '0';
    document.body.style.width = '100vw';
    document.body.style.height = '100vh';
    document.body.style.overflow = 'hidden';
    document.body.appendChild(overlay);

    // Listen for orientation change
    window.addEventListener('orientationchange', function() {
      if (window.matchMedia("(orientation: landscape)").matches) {
        // Remove the overlay if the device is rotated to landscape mode
        document.body.removeChild(overlay);
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.width = '';
        document.body.style.height = '';
        document.body.style.overflow = 'auto';
      }
    });
  }
</script>
