  var originalLeft = img.style.left;

    sunflowerSound.currentTime = 0;

  setTimeout(function() {
    sound.pause();
    sound.currentTime = 0; // Reset to the beginning
  }, 2600); // stop after 2.6 seconds

  setTimeout(function() {
    img.src = originalSrc;
    img.style.width = originalWidth;
    img.style.height = originalHeight;
    img.style.top = originalTop;
    img.style.left = originalLeft;
      img.style.transform = 'scaleX(1)';
  }, 2100);

  // Hide the image after 2.1 seconds
  setTimeout(function() {

}
</script>

<script>
  var countdownInterval;
  var countdownValue = 1;
  var isCountdownRunning = false;
  var isCountdownFinished = false;

  function handleClick() {
    if (!isCountdownRunning) {
      startCountdown();
    } else if (isCountdownFinished) {
      openCurtain();
    }
  }

  function startCountdown() {
    isCountdownRunning = true;
    document.getElementById('countdown').style.display = 'block';
    document.getElementById('countdown').innerHTML = "Good Day!";
    countdownValue = 1;
    countdownInterval = setInterval(function() {
      countdownValue--;
      if (countdownValue === 0) {
        clearInterval(countdownInterval);
        isCountdownFinished = true;
        document.getElementById('countdown').style.display = 'none';
      }
    }, 1000);
  }

  function openCurtain() {
    var curtainSound = document.getElementById('curtainSound');
    var zgSound = document.getElementById('zgSound');
    
    document.getElementById('overlay-left').style.transform = 'translateX(-100%)';
    document.getElementById('overlay-right').style.transform = 'translateX(100%)';
    curtainSound.volume = 1; 
    curtainSound.currentTime = 0; 
    curtainSound.play();
    
    setTimeout(function() {
      zgSound.volume = 1; 
      zgSound.currentTime = 0; 
      zgSound.play();
    }, 3000); 
    
    setTimeout(function() {
      document.getElementById('overlay').style.display = 'none';
    }, 3000); 
  }
</script>
<audio id="curtainSound" src="sounds/curtain.weba" preload="auto"></audio>
