<script>
 var isSunflowerPlaying = false;
function playSunflower() {
  var audio = document.getElementById('sound');
  var zgAudio = document.getElementById('zgSound');
  var allAudios = document.querySelectorAll('audio');
  allAudios.forEach(function(audioElement) {
    if (audioElement !== audio && audioElement !== zgAudio) {
      audioElement.pause();
      audioElement.currentTime = 0;
    }
  });
  if (isSunflowerPlaying) {
    audio.pause();
    zgAudio.play();
  } else {
    zgAudio.pause();
    zgAudio.currentTime = 0;
    audio.play();
    audio.currentTime = 18;
  }
  isSunflowerPlaying = !isSunflowerPlaying;

  // Add or remove image from center of page
  var existingImg = document.getElementById('center-image');
  if (existingImg) {
    existingImg.remove();
  } else {
    var img;
    setTimeout(function() {
      img = document.createElement('img');
      img.id = 'center-image';
      img.src = 'https://tcrf.net/images/thumb/c/c3/PVZ_Dancing_zombie_unpoint_pregoty.gif/200px-PVZ_Dancing_zombie_unpoint_pregoty.gif';
      img.style.position = 'fixed';
      img.style.top = '85%';
      img.style.left = '50%';
      img.style.transform = 'translate(-50%, -50%) scaleX(1)';
      img.style.zIndex = '1';
      img.style.width = '9vw';
      img.style.height = 'auto';
      document.body.appendChild(img);

      if (window.innerWidth <= 768) {
        img.style.top = '31.5%';
        img.style.left = '50%';
        img.style.width = '19.5vw';
        img.style.height = 'auto';
      }

      setInterval(function() {
        var currentTransform = img.style.transform;
        if (currentTransform.includes('scaleX(1)')) {
          img.style.transform = 'translate(-50%, -50%) scaleX(-1)';
        } else {
          img.style.transform = 'translate(-50%, -50%) scaleX(1)';
        }
      }, 2000);

      audio.addEventListener('ended', function() {
        if (img) {
          img.remove();
        }
      });
    }, 3500);
  }
}
</script>

<script>
function swapImage(img) {
  var originalSrc = img.src;
  var originalWidth = img.style.width;
  var originalHeight = img.style.height;
  var originalTop = img.style.top;
  var originalLeft = img.style.left;

  var newWidth = '14vw';
  var newHeight = 'auto';
  var newTop = '67.5vh';
  var newLeft = '63.6vw';

  if (window.matchMedia('(max-width: 768px)').matches) {
    img.style.width = '200vw';
    img.style.top = '1vh';
  } else {
    img.style.width = newWidth;
    img.style.top = newTop;
  }

  img.src = 'https://media.tenor.com/ThuWn7lu_BYAAAAj/squash-plants-vs-zombies.gif';
  img.style.height = newHeight;
  img.style.left = newLeft;
  img.style.transform = 'scaleX(-1)';

  // Pause all audio elements
  var audios = document.getElementsByTagName('audio');
  for (var i = 0; i < audios.length; i++) {
    audios[i].pause();
    audios[i].currentTime = 0; // Reset to the beginning
  }

  var sound = document.getElementById('squash-sound');
  sound.currentTime = 2; // forward to 2 seconds
  sound.play();

  setTimeout(function() {
    sound.pause();
    sound.currentTime = 0; // Reset to the beginning
  }, 2600); // stop after 2.6 seconds

  setTimeout(function() {
    img.src = originalSrc;
    img.style.width = originalWidth;
    img.style.height = originalHeight;
    img.style.top = originalTop;
    img.style.left = originalLeft;
      img.style.transform = 'scaleX(1)';
  }, 2100);

  // Hide the image after 2.1 seconds
  setTimeout(function() {
    var zombieImg = document.querySelector('img[src*="PVZ_Dancing_zombie_unpoint_pregoty.gif"]');
    if (zombieImg) {
      zombieImg.style.display = 'none';
    }
  }, 2100);
}


</script>
