  <style>
    body {
  background-image: url('https://wallpapers.com/images/hd/pink-abstract-background-47pa2nmitlkqn6v2.jpg');
  background-size: cover;
  font-family: 'Montserrat', sans-serif !important; 
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

  

    .modal {
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
  display: grid;
  grid-template-columns: repeat(4, 100px);
  gap: 5px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-height: 423px; /* 4 rows x 100px + 3 gaps x 10px */
  overflow-y: auto;
}

.modal-content img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  cursor: pointer;
  margin-bottom: 1px;
}

    .image-modal {
      position: fixed;
      z-index: 2;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      cursor: pointer;
    }

    .image-close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  color: white;
  cursor: pointer;
  z-index: 3;
}


/* Scrollbar styles */
.modal-content::-webkit-scrollbar, .container1::-webkit-scrollbar, .container-item::-webkit-scrollbar {
  width: 1vw;
  height: 1vw;
}

.modal-content::-webkit-scrollbar-thumb, .container1::-webkit-scrollbar-thumb, .container-item::-webkit-scrollbar-thumb {
  background-image: url('https://www.sleepdr.com/wp-content/uploads/2017/02/pink-noise-can-help-you-sleep.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 0.2vw;
}

.modal-content::-webkit-scrollbar-track, .container1::-webkit-scrollbar-track, .container-item::-webkit-scrollbar-track {
  background-image: url('https://img.freepik.com/free-vector/colorful-background-with-rough-texture-geometric-background-banner-background-template_474888-5651.jpg?semt=ais_incoming&w=740&q=80');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 0.2vw;
}


.video-episodes {
 
  max-width: 80vw;
  margin: 5vh auto;
  text-align: center;
  
}

.episode-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2vw;
}

.episode {
  background-color: rgba(0, 0, 0, 0.1);
  padding: 1vh 1vw;
  border-radius: 0.5vw;
  box-shadow: 0 0 1vh rgba(0, 0, 0, 0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.episode img {
  width: 4.5vw;
  height: 4.5vw;
  object-fit: cover;
  border-radius: 0.5vw;
}

.episode h3 {
  font-size: .8vw;
  margin-top: 1vh;
  font-weight: 450;
}

.episode a {
  text-decoration: none;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  
}

.pagination {
  margin-top: 1vh;
}
.pagination button {
  margin: 0 .5vw;
  padding: .8vh .8vw;
  border: none;
  border-radius: 0.5vw;
  background-color: #d3d3d3; /* Light gray background color */
  color: #333; /* Dark text color */
  cursor: pointer;
  font-size: 1vw;
}

.pagination button:hover {
  background-color: #ccc; /* Lighter gray hover background color */
}

.pagination button.active {
  background-color: #999; /* Darker gray active background color */
}

.Doc-logo {
    width: 8vw;
    height: auto;
}


    @media (max-width: 768px) {
   .modal-content {
    grid-template-columns: repeat(4, 80px);
    gap: 5px;
    max-height: 340px; /* 4 rows x 80px + 3 gaps x 5px */
  }
  
  .modal-content img {
    width: 80px;
    height: 80px;
  }
  
  
  .modal-content::-webkit-scrollbar { 
    display: none; /* Chrome, Safari, Opera */
  }

  .episode-list {
    grid-template-columns: repeat(4, 1fr);
     margin-bottom: -4vh
  }
  .pagination button {
    padding: .5vh 1.5vw;
    font-size: 3vw;
  }
  .episode img {
    width: 15vw;
    height: 15vw;
    
  }
  .Doc-logo {

}

}

}

.back-button img {
  width: 30px !important;

}

.play-button {
  width: 45px !important;
  height: auto !important;
  top:-20px !important ;
  right: -20px !important ;
}

}

@media (max-width: 375px) {
  .modal-content {
    grid-template-columns: repeat(4, 80px);
    gap: 5px;
    max-height: 340px; /* 4 rows x 80px + 3 gaps x 5px */
  }
  
  .modal-content img {
    width: 80px;
    height: 80px;
  }
  
  
  .modal-content::-webkit-scrollbar { 
    display: none; /* Chrome, Safari, Opera */
  }

}


@media (max-width: 768px) {
  #image-modal img[style*="position: absolute"] {
    width: 25px !important;
    height: 25px !important;
  }
}


.play-button {
  position: fixed;
  top: -15px;
  right: -15px;
  margin: 10px;
  padding: 1rem;
  border-radius: 0.25rem;
  cursor: pointer;
  width: 5vw; 
  height: auto;
  object-fit: cover;
}

.play-button:hover {
  transform: scale(1.1);
  transition: transform 0.3s ease-in-out;
}



    .back-button-container {
  position: fixed;
  top: 5px;
  left: -5px;
}

.back-button img {
  width: 2.5vw;
  height: auto;
  transform: scaleX(-1);
}

.back-button {
  display: inline-block;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 0.25rem;
  cursor: pointer;
  text-decoration: none;
}

.back-button:hover {
  transform: scale(1.1);
  transition: transform 0.3s ease-in-out;
}

    let currentPage = 1;

    function generateEpisodeList(page) {
  const start = (page - 1) * episodesPerPage;
  const end = start + episodesPerPage;
  const list = document.getElementById('episode-list');
  list.innerHTML = '';
  episodes.slice(start, end).forEach(([title, id, image], index) => {
    list.insertAdjacentHTML('beforeend', `
  <li class="episode">
    <a href="${id}" target="_blank">
      <img src="${image}" alt="${title}">
      <h3>${title}</h3>
    </a>
  </li>
`);
});
}

    

    function generatePagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(episodes.length / episodesPerPage);
      pagination.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const button = document.createElement('button');
        button.textContent = i;
        button.onclick = () => {
          currentPage = i;
          generateEpisodeList(currentPage);
          updateActiveButton();
        };
        pagination.appendChild(button);
      }
      updateActiveButton();
    }

    function updateActiveButton() {
  const buttons = document.querySelectorAll('#pagination button');
  buttons.forEach((button, index) => {
    if (index + 1 === currentPage) {
      button.classList.add('active');
    } else {
      button.classList.remove('active');
    }
  });
}

    generateEpisodeList(currentPage);
    generatePagination();
  </script>


   <script>
  function showModal() {
  document.querySelector('.Doc-logo').style.display = 'none';
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.querySelector('.Doc-logo').style.display = 'block';
  document.getElementById("modal").style.display = "none";
}
let currentImageIndex;
let images;

function showImageModal(src) {
  images = document.querySelectorAll('.modal-content img');
  for (let i = 0; i < images.length; i++) {
    if (images[i].src === src) {
      currentImageIndex = i;
      break;
    }
  }
  document.getElementById("large-image").src = src;
  document.getElementById("image-modal").style.display = "flex";
  document.getElementById("image-modal").addEventListener("touchstart", handleTouchStart);
  document.getElementById("image-modal").addEventListener("touchend", handleTouchEnd);
  document.getElementById("large-image").addEventListener("click", handleClick);
}

function closeImageModal() {
  document.getElementById("image-modal").style.display = "none";
  document.getElementById("image-modal").removeEventListener("touchstart", handleTouchStart);
  document.getElementById("image-modal").removeEventListener("touchend", handleTouchEnd);
  document.getElementById("large-image").removeEventListener("click", handleClick);
}
document.getElementById("image-modal").addEventListener("click", function(event) { if (event.target === this) { closeImageModal(); } });

let startX;

function handleTouchStart(e) {
  startX = e.touches[0].clientX;
}

function handleTouchEnd(e) {
  let endX = e.changedTouches[0].clientX;
  if (startX > endX + 50) {
    showNextImage();
  } else if (startX < endX - 50) {
    showPreviousImage();
  }
}

function handleClick(e) {
  if (!isZoomed) {
    let rect = document.getElementById("large-image").getBoundingClientRect();
    let x = e.clientX - rect.left;
    if (x < rect.width / 2) {
      showPreviousImage();
    } else {
      showNextImage();
    }
  } else {
    e.preventDefault(); 
  }
}

function showPreviousImage() {
  currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
  document.getElementById("large-image").src = images[currentImageIndex].src;
}

function showNextImage() {
  currentImageIndex = (currentImageIndex + 1) % images.length;
  document.getElementById("large-image").src = images[currentImageIndex].src;
}
const stackedImages = document.querySelectorAll('.stacked-images img');

stackedImages.forEach((image, index) => {
  if (index === 0) {
    image.style.top = `50%`;
    image.style.left = `50%`;
    image.style.transform = `translate(-50%, -50%) ${image.style.transform}`;
    image.style.zIndex = stackedImages.length - index;
  } else {
    const x = Math.random() * 200 - 100; 
    const y = Math.random() * 200 - 100; 

    image.style.top = `calc(50% + ${y}px)`;
    image.style.left = `calc(50% + ${x}px)`;
    image.style.zIndex = stackedImages.length - index;
  }
});

// Add the new code here
document.getElementById("modal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeModal();
  }
});

document.getElementById("image-modal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeImageModal();
  }
});

let zoomButton = document.createElement('img');
zoomButton.src = 'https://cdn-icons-png.freepik.com/512/10337/10337546.png'; // Replace with your zoom icon
zoomButton.style.position = 'absolute';
zoomButton.style.bottom = '10px';
zoomButton.style.right = '10px';
zoomButton.style.width = '40px';
zoomButton.style.height = '40px';
zoomButton.style.cursor = 'pointer';
zoomButton.style.zIndex = '1000'; // Add this line to ensure the button is on top

let isZoomed = false;
let isZoomedMore = false;
let scale = 1;
let isDragging = false;
let offset = [0, 0];
let currentTransform = [0, 0];

zoomButton.addEventListener('click', function() {
  if (!isZoomed) {
    scale = 2; // Increased zoom level
    document.getElementById("large-image").style.transition = 'transform 0.3s ease-in-out';
    document.getElementById("large-image").style.transform = `scale(${scale}) translate(${currentTransform[0]}px, ${currentTransform[1]}px)`;
    isZoomed = true;
    zoomButton.src = 'https://cdn-icons-png.freepik.com/512/10337/10337546.png'; // Same icon, but now it zooms more
  } else if (isZoomed && !isZoomedMore) {
    scale = 3; // Increased zoom level
    document.getElementById("large-image").style.transition = 'transform 0.3s ease-in-out';
    document.getElementById("large-image").style.transform = `scale(${scale}) translate(${currentTransform[0]}px, ${currentTransform[1]}px)`;
    isZoomedMore = true;
    zoomButton.src = 'https://cdn-icons-png.freepik.com/512/15430/15430794.png'; // Unzoom icon
  } else {
    scale = 1;
    currentTransform = [0, 0]; // Reset transform
    document.getElementById("large-image").style.transition = 'transform 0.3s ease-in-out';
    document.getElementById("large-image").style.transform = `scale(${scale}) translate(${currentTransform[0]}px, ${currentTransform[1]}px)`;
    isZoomed = false;
    isZoomedMore = false;
    zoomButton.src = 'https://cdn-icons-png.freepik.com/512/10337/10337546.png'; // Zoom icon
  }
});

document.getElementById("large-image").addEventListener("touchstart", function(event) {
  if (isZoomed) {
    isDragging = true;
    offset = [
      event.touches[0].clientX - currentTransform[0],
      event.touches[0].clientY - currentTransform[1]
    ];
    if (isDragging) {
      event.stopPropagation(); // Only stop propagation when dragging
    }
  }
});

document.getElementById("large-image").addEventListener("touchmove", function(event) {
  if (isDragging) {
    currentTransform = [
      event.touches[0].clientX - offset[0],
      event.touches[0].clientY - offset[1]
    ];
    document.getElementById("large-image").style.transform = `scale(${scale}) translate(${currentTransform[0]}px, ${currentTransform[1]}px)`;
    event.stopPropagation(); // Only stop propagation when dragging
  }
});

document.getElementById("large-image").addEventListener("touchend", function(event) {
  isDragging = false;
  // Remove event.stopPropagation() from here
});

function handleTouchStart(e) {
  if (!isZoomed) {
    startX = e.touches[0].clientX;
  }
}

function handleTouchEnd(e) {
  if (!isZoomed) {
    let endX = e.changedTouches[0].clientX;
    if (startX > endX + 50) {
      showNextImage();
    } else if (startX < endX - 50) {
      showPreviousImage();
    }
  }
}

document.getElementById("image-modal").addEventListener("touchstart", handleTouchStart);
document.getElementById("image-modal").addEventListener("touchend", handleTouchEnd);
document.getElementById("image-modal").appendChild(zoomButton);

  window.open(document.getElementById("large-image").getAttribute('data-link'), '_blank');
});
document.getElementById("image-modal").appendChild(imageText);

function showImageModal(src) {
  images = document.querySelectorAll('.modal-content img');
  for (let i = 0; i < images.length; i++) {
    if (images[i].src === src) {
      currentImageIndex = i;
      break;
    }
  }
  document.getElementById("large-image").src = src;
  document.getElementById("large-image").setAttribute('data-link', document.querySelector(`img[src="${src}"]`).getAttribute('data-link'));
  document.getElementById("image-modal").style.display = "flex";
  document.getElementById("image-modal").addEventListener("touchstart", handleTouchStart);
  document.getElementById("image-modal").addEventListener("touchend", handleTouchEnd);
  document.getElementById("large-image").addEventListener("click", handleClick);
  imageText.innerHTML = document.querySelector(`img[src="${src}"]`).getAttribute('data-text');
}




// NEXT AND PREVIOUS NAME OF IMAGES FUNCTION
function updateImageText() {
  imageText.innerHTML = document.querySelector(`img[src="${document.getElementById("large-image").src}"]`).getAttribute('data-text');
  document.getElementById("large-image").setAttribute('data-link', document.querySelector(`img[src="${document.getElementById("large-image").src}"]`).getAttribute('data-link'));
}

function showPreviousImage() {
  currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
  document.getElementById("large-image").src = images[currentImageIndex].src;
  updateImageText();
}

function showNextImage() {
  currentImageIndex = (currentImageIndex + 1) % images.length;
  document.getElementById("large-image").src = images[currentImageIndex].src;
  updateImageText();
}





// OPPSSS LIMIT
// GRAB FUNCTION
document.getElementById("large-image").style.cursor = 'grab';
document.getElementById("large-image").addEventListener("mousedown", function(event) {
  if (isZoomed) {
    isDragging = true;
    offset = [
      event.clientX - currentTransform[0],
      event.clientY - currentTransform[1]
    ];
    event.preventDefault(); 
    document.getElementById("large-image").style.cursor = 'grabbing';
  }
});

document.addEventListener("mousemove", function(event) {
  if (isDragging) {
    currentTransform = [
      event.clientX - offset[0],
      event.clientY - offset[1]
    ];
    document.getElementById("large-image").style.transform = `scale(${scale}) translate(${currentTransform[0]}px, ${currentTransform[1]}px)`;
  }
});

document.addEventListener("mouseup", function(event) {
  isDragging = false;
  document.getElementById("large-image").style.cursor = 'grab';
});

  </script>
